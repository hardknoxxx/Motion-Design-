    </div>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      // PRNG con semilla: mismo resultado en cada render
      let s = 7;
      const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);

      // 0.0–0.3 papel vacío; 0.3–0.65 cae el punto; squash al tocar
      tl.fromTo("#intro-punto", { y: -560 }, { y: 0, duration: 0.35, ease: "power2.in" }, 0.3);
      tl.fromTo("#intro-sombra", { scaleX: 0.2, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.35, ease: "power2.in" }, 0.3);
      tl.to("#intro-punto", { scaleX: 1.35, scaleY: 0.7, y: 5, duration: 0.06, ease: "power2.out" }, 0.65);
      tl.to("#intro-punto", { scaleX: 1, scaleY: 1, y: -46, duration: 0.18, ease: "power2.out" }, 0.71);
      tl.to("#intro-punto", { y: 0, duration: 0.11, ease: "power2.in" }, 0.89);
      tl.to("#intro-sombra", { scaleX: 0.6, opacity: 0.5, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1 }, 0.71);

      // 1.0 big bang: anillos que se expanden y se desvanecen
      gsap.set(".intro-anillo, .intro-chispa", { opacity: 0 });
      tl.fromTo("#intro-anillo-1", { scale: 0.06, opacity: 1 }, { scale: 1.6, opacity: 0, duration: 0.7, ease: "expo.out", immediateRender: false }, 1.0);
      tl.fromTo("#intro-anillo-2", { scale: 0.06, opacity: 1 }, { scale: 2.1, opacity: 0, duration: 0.9, ease: "expo.out", immediateRender: false }, 1.06);
      tl.to("#intro-sombra", { opacity: 0, duration: 0.1 }, 1.08);
      tl.to("#intro-punto", { scale: 1.25, duration: 0.25, ease: "back.out(2)" }, 1.0);

      // 8 hojas abren como un asterisco
      for (let i = 0; i < 8; i++) {
        tl.fromTo(
          "#intro-hoja-" + i,
          { rotation: i * 45, scale: 0, opacity: 1 },
          { scale: 1, duration: 0.42, ease: "back.out(1.7)" },
          1.02 + i * 0.022,
        );
      }
      // chispas sueltas que salen disparadas
      for (let i = 0; i < 10; i++) {
        const a = rnd() * Math.PI * 2;
        const r = 170 + rnd() * 260;
        tl.fromTo(
          "#intro-chispa-" + i,
          { x: 0, y: 0, scale: 0.4 + rnd(), opacity: 1 },
          { x: Math.cos(a) * r, y: Math.sin(a) * r, opacity: 0, duration: 0.9 + rnd() * 0.4, ease: "expo.out", immediateRender: false },
          1.0,
        );
      }
      // la órbita se dibuja
      tl.fromTo("#intro-orbita-linea", { strokeDasharray: 1100, strokeDashoffset: 1100 }, { strokeDashoffset: 0, duration: 0.55, ease: "power2.inOut" }, 1.4);
      tl.fromTo("#intro-orbita", { rotation: -6 }, { rotation: 4, duration: 0.8, ease: "none" }, 1.4);

      // tipeo mono, 14 caracteres por segundo, cursor que parpadea
      const letras = document.querySelectorAll("#intro-texto span");
      letras.forEach((el, i) => tl.set(el, { opacity: 1 }, 1.5 + i * 0.035));
      gsap.set("#intro-cursor", { opacity: 0 });
      tl.fromTo("#intro-cursor", { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "steps(1)", repeat: 5, yoyo: true, immediateRender: false }, 1.5);

      // 2.2 colapso: todo vuelve al centro
      for (let i = 0; i < 8; i++) {
        tl.to("#intro-hoja-" + i, { scale: 0, duration: 0.2, ease: "power3.in" }, 2.2);
      }
      tl.to("#intro-orbita", { opacity: 0, scale: 0.3, duration: 0.2, ease: "power3.in" }, 2.2);
      tl.to("#intro-texto", { opacity: 0, filter: "blur(6px)", duration: 0.15 }, 2.2);

      // 2.4 el punto crece y se vuelve el fondo (flood del acento)
      tl.to("#intro-punto", { scale: 3, duration: 0.15, ease: "expo.out" }, 2.4);
      tl.to("#intro-punto", { scale: 90, duration: 0.18, ease: "power3.in" }, 2.55);

      window.__timelines["intro"] = tl;
    })();
  </script>
