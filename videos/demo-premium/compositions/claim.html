    (function () {
      const tl = gsap.timeline({ paused: true });
      let s = 11;
      const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);

      // 0–0.3 iris de papel desde el centro sobre el flood lima

      tl.fromTo("#claim-marcador", { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power2.out" }, 1.28);

      // chips con sombra suave, de a uno
      const orden = [0, 1, 2, 3, 4, 5];
      orden.forEach((n, i) => {
        const rot = (rnd() - 0.5) * 7;
        tl.fromTo(
          "#claim-chip-" + n,
          { opacity: 0, scale: 0.86, y: 18, rotation: rot * 0.4, filter: "blur(6px)" },
          { opacity: 1, scale: 1, y: 0, rotation: rot, filter: "blur(0px)", duration: 0.4, ease: "expo.out" },
          0.58 + i * 0.14,
        );

      // píldora con countdown que corre de verdad
      tl.fromTo("#claim-pildora", { opacity: 0, y: 16, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "expo.out" }, 0.85);
      const reloj = document.getElementById("claim-reloj");
      const pad = (n) => String(Math.floor(n)).padStart(2, "0");
      const cuenta = { seg: 71 * 3600 + 53 * 60 + 8 };
      const pinta = () => {
        const t = cuenta.seg;
        reloj.textContent = pad(t / 3600) + ":" + pad((t % 3600) / 60) + ":" + pad(t % 60);
      };
      pinta();
      tl.to(cuenta, { seg: 2 * 3600 + 14 * 60 + 36, duration: 2.0, ease: "power2.inOut", onUpdate: pinta }, 0.9);

      // 2.95 salida: chips dispersados radialmente con blur

        const el = document.getElementById("claim-chip-" + n);
        const cx = parseFloat(el.style.left) + 150 - 960;
        const cy = parseFloat(el.style.top) + 38 - 520;
        const d = Math.hypot(cx, cy) || 1;

          { x: (cx / d) * 380, y: (cy / d) * 380, opacity: 0, filter: "blur(10px)", duration: 0.25, ease: "power3.in" },
          2.95 + i * 0.02,
        );
      });
