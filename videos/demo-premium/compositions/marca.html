    (function () {
      const tl = gsap.timeline({ paused: true });
      let s = 23;
      const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);

      gsap.set("#marca-palabra span, #marca-lema, #marca-cta, #marca-anillo, #marca-final, #marca-vineta", { opacity: 0 });
      
      // 0–0.42 partículas con estela que convergen en un anillo de 8
      for (let i = 0; i < 8; i++) {
        const a = rnd() * Math.PI * 2;
        const r = 560 + rnd() * 380;
        const fx = Math.cos(a) * r;
        const fy = Math.sin(a) * r;
        const ta = (i / 8) * Math.PI * 2;
        const tx = Math.cos(ta) * 120;
        const ty = Math.sin(ta) * 120;
        const ang = (Math.atan2(ty - fy, tx - fx) * 180) / Math.PI;
        tl.fromTo(
          "#marca-p-" + i,
          { x: fx, y: fy, rotation: ang, scaleX: 4, filter: "blur(4px)" },
          { x: tx, y: ty, scaleX: 1, filter: "blur(0px)", duration: 0.42, ease: "expo.out" },
          i * 0.015,
        );
        // colapso al centro
        tl.to("#marca-p-" + i, { x: 0, y: 0, scale: 0.4, duration: 0.15, ease: "power3.in" }, 0.47);
        tl.set("#marca-p-" + i, { opacity: 0 }, 0.62);
      }

      // 0.6 aparece el logo con el anillo de acento que pulsa
      tl.fromTo("#marca-logo", { scale: 0, rotation: -50 }, { scale: 1, rotation: 0, duration: 0.42, ease: "back.out(1.8)" }, 0.6);
      tl.fromTo("#marca-anillo", { scale: 0.25, opacity: 1 }, { scale: 1.35, opacity: 0, duration: 0.7, ease: "expo.out" }, 0.6);
      [
        [150, -110, 1.1],
        [-160, -60, 0.8],
        [130, 95, 0.6],
      ].forEach(([x, y, k], i) => {
        tl.fromTo(
          "#marca-destello-" + i,
          { x: x * 0.6, y: y * 0.6, scale: 0, rotation: -45 },
          { x, y, scale: k, rotation: 0, duration: 0.35, ease: "back.out(2.2)" },
          0.72 + i * 0.06,
        );
        tl.to("#marca-destello-" + i, { scale: 0, duration: 0.2, ease: "power2.in" }, 1.25 + i * 0.03);
      });

      // 1.25 el logo sube y el wordmark entra letra a letra
      tl.to("#marca-centro", { y: -200, scale: 0.62, duration: 0.42, ease: "power3.inOut" }, 1.25);
      tl.fromTo(
        "#marca-palabra span",
        { opacity: 0, y: 24, filter: "blur(10px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "expo.out", stagger: 0.08 },
        1.38,

      tl.fromTo("#marca-lema", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, 1.8);
      tl.fromTo("#marca-cta", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, 2.08);

      // hold quieto ~2,4 s; 4.55 viñeta que se cierra a negro

      window.__timelines["marca"] = tl;
