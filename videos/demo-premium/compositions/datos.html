  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const capas = ["#datos-c1", "#datos-c2", "#datos-c3", "#datos-c4"];
      // cortes secos cada 0,5 s (un beat a 120 BPM): sin tween, solo set
      capas.forEach((c, i) => {
        tl.set(c, { opacity: i === 0 ? 1 : 0 }, 0);
        if (i > 0) tl.set(c, { opacity: 1 }, i * 0.5);
        if (i < 3) tl.set(c, { opacity: 0 }, (i + 1) * 0.5);
      });

      // números que ruedan desde un valor cercano y aterrizan quietos
      const miles = (n) => Math.round(n).toLocaleString("de-DE");
      const rueda = (sel, desde, hasta, fmt, t) => {
        const el = document.querySelector(sel);
        const o = { v: desde };
        const pinta = () => (el.textContent = fmt(o.v));
        pinta();
        tl.to(o, { v: hasta, duration: 0.42, ease: "expo.out", onUpdate: pinta }, t);
        tl.fromTo(el, { filter: "blur(10px)", y: -18 }, { filter: "blur(0px)", y: 0, duration: 0.34, ease: "expo.out" }, t);
      };
      rueda("#datos-num-1", 9870, 12000, (v) => miles(v) + "+", 0);
      rueda("#datos-num-2", 71, 98, (v) => Math.round(v) + "%", 0.5);
      rueda("#datos-num-3", 9, 3, (v) => Math.round(v) + " min", 1.0);
      rueda("#datos-num-4", 3.2, 4.9, (v) => v.toFixed(1).replace(".", ",") + "/5", 1.5);
      tl.to("#datos-estrellas span", { opacity: 1, duration: 0.05, stagger: 0.05 }, 1.58);

      // el panel lima se difumina hacia la marca
      tl.to("#datos-c4", { scale: 0.96, filter: "blur(20px)", opacity: 0, duration: 0.2, ease: "power2.in" }, 1.93);

      window.__timelines["datos"] = tl;
    })();
  </script>
