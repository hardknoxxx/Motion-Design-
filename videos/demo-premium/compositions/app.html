    (function () {
      const tl = gsap.timeline({ paused: true });

      // estados iniciales que dependen del tiempo

      // 0.1 aparece el buscador

      // placeholder letra a letra (sube 6 px y aparece)
      const ph = document.querySelectorAll("#app-placeholder span");
      ph.forEach((el, i) => tl.fromTo(el, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.16, ease: "power2.out" }, 0.55 + i * 0.03));
      // se borra rápido, de atrás hacia adelante
      for (let i = ph.length - 1; i >= 0; i--) tl.set(ph[i], { display: "none" }, 1.45 + (ph.length - 1 - i) * 0.02);
      // se tipea la consulta real
      const q = document.querySelectorAll("#app-consulta span");
      q.forEach((el, i) => tl.set(el, { opacity: 1 }, 1.95 + i * 0.085));
      tl.fromTo("#app-cursor", { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "steps(1)", repeat: 9, yoyo: true }, 0.4);

      // 2.75 morph: el buscador se vuelve la isla del teléfono

      tl.fromTo(
        "#app-busca",
        { clipPath: "inset(0px 0px 0px 0px round 48px)" },
        { clipPath: "inset(28px 320px 28px 320px round 20px)", duration: 0.45, ease: "power3.inOut" },

      tl.to("#app-busca-env", { y: -367, duration: 0.45, ease: "power3.inOut" }, 2.8);
      tl.to("#app-busca", { backgroundColor: "#070C0C", boxShadow: "inset 0 1px 0 rgba(255,255,255,0)", duration: 0.3, ease: "power2.in" }, 2.95);
      tl.set("#app-busca-env", { opacity: 0 }, 3.25);
      // el teléfono se abre desde la isla, recién cuando la píldora llegó
      tl.set("#app-tel-env", { opacity: 1 }, 3.25);
      tl.fromTo(
        "#app-tel",
        { clipPath: "inset(18px 150px 842px 150px round 20px)" },
        { clipPath: "inset(0px 0px 0px 0px round 66px)", duration: 0.38, ease: "power3.inOut" },
        3.25,
      );
      tl.fromTo("#app-mini", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, 3.52);

      // 3.45 la tarjeta sube con capas escalonadas
      tl.set("#app-tarjeta-env", { opacity: 1 }, 3.6);
      tl.fromTo("#app-tarjeta-env", { y: 520 }, { y: 0, duration: 0.5, ease: "expo.out" }, 3.6);
      tl.fromTo("#app-foto-img", { scale: 1.15, rotation: -8 }, { scale: 1, rotation: 0, duration: 0.7, ease: "expo.out" }, 3.6);
      tl.fromTo("#app-fila-1, #app-fila-2, #app-boton", { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "expo.out", stagger: 0.05 }, 3.7);
      // reflejo sutil que cruza una vez
      tl.fromTo("#app-brillo", { xPercent: -120 }, { xPercent: 120, duration: 0.6, ease: "power2.inOut" }, 4.1);

      // 4.15 toque en el botón
      tl.fromTo("#app-toque", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.12, ease: "power2.out" }, 4.25);
      tl.to("#app-toque", { opacity: 0, scale: 1.6, duration: 0.25, ease: "power2.out" }, 4.39);
      tl.to("#app-boton", { scale: 0.96, duration: 0.08, ease: "power2.out" }, 4.3);
      tl.to("#app-boton", { scale: 1, duration: 0.14, ease: "power2.out" }, 4.38);

      // 4.35 la tarjeta crece y rompe el marco; el resto se difumina
      tl.to("#app-tarjeta-env", { scale: 1.42, y: -30, duration: 0.45, ease: "power2.inOut" }, 4.5);
      tl.to("#app-tel-env", { filter: "blur(10px)", opacity: 0.55, duration: 0.35, ease: "power2.out" }, 4.55);
      // whip vertical
      tl.to("#app-tarjeta-env", { y: -1150, filter: "blur(22px)", duration: 0.22, ease: "power3.in" }, 5.05);
      tl.to("#app-tel-env", { filter: "blur(0px)", opacity: 1, duration: 0.2, ease: "power2.out" }, 5.2);
      tl.set("#app-mini", { opacity: 0 }, 5.27);

      // 5.12 flood verde desde la esquina del teléfono, y detrás el plan de riego
      tl.fromTo("#app-flood", { scale: 0 }, { scale: 13, duration: 0.32, ease: "power2.inOut" }, 5.27);
      tl.fromTo(
        "#app-plan",
        { clipPath: "circle(0% at 92% 4%)" },
        { clipPath: "circle(150% at 92% 4%)", duration: 0.38, ease: "power2.inOut" },
        5.41,
      );
      // ruta que se dibuja y días que ruedan
      tl.fromTo("#app-ruta-linea", { strokeDasharray: 720, strokeDashoffset: 720 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 5.7);
      tl.fromTo("#app-ruta-meta", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.3, ease: "back.out(2.5)" }, 6.2);
      tl.fromTo("#app-barra-relleno", { scaleX: 0 }, { scaleX: 0.86, duration: 0.6, ease: "power2.inOut" }, 5.7);
      [1, 2, 3].forEach((k, i) => {
        tl.to("#app-rueda-col", { y: -96 * k, duration: 0.16, ease: "power3.out" }, 5.77 + i * 0.18);
        tl.fromTo("#app-rueda", { filter: "blur(0px)" }, { filter: "blur(4px)", duration: 0.06, yoyo: true, repeat: 1 }, 5.77 + i * 0.18);
      });
      tl.set("#app-eta-unidad", { textContent: "día" }, 6.31);

      // 6.25 notificación que cae desde la isla + empuje de cámara
      tl.set("#app-aviso-env", { opacity: 1 }, 6.3);
      tl.fromTo("#app-aviso-env", { y: -90, scale: 0.9 }, { y: 0, scale: 1, duration: 0.38, ease: "expo.out" }, 6.3);
      tl.fromTo("#app-cam", { scale: 1 }, { scale: 1.08, duration: 0.8, ease: "power2.out", transformOrigin: "50% 20%" }, 6.3);

      // 6.7 el ícono se vuelve el mundo
      tl.set("#app-mundo", { opacity: 1 }, 6.75);
      tl.fromTo("#app-mundo", { scale: 1.08 }, { scale: 48, duration: 0.45, ease: "power2.inOut" }, 6.75);
      tl.to("#app-cam", { filter: "blur(15px)", duration: 0.3, ease: "power2.in" }, 6.75);

      window.__timelines["app"] = tl;
    })();
