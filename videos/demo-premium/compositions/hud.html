  <div id="root" data-composition-id="hud" data-width="1920" data-height="1080" data-layout-ignore>
    <div id="hud-marco">
      <i class="hud-esq" id="hud-esq-1"></i>
      <i class="hud-esq" id="hud-esq-2"></i>

      <div class="hud-txt" id="hud-marca"><b>RAÍZ</b> &nbsp;/&nbsp; MOTION REEL '26</div>
      <div class="hud-txt" id="hud-tc"><i></i>TC <span id="hud-tc-num">00:00:00:00</span></div>
      <div class="hud-txt" id="hud-seccion">01 — CHISPA</div>
      <div class="hud-txt" id="hud-formato">1920 × 1080 · 30 FPS</div>

  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const DUR = 21;
      // timecode real, derivado del tiempo del timeline
      const tc = document.getElementById("hud-tc-num");
      const p2 = (n) => String(n).padStart(2, "0");
      const reloj = { t: 0 };
      const pinta = () => {
        const f = Math.floor(reloj.t * 30 + 1e-6);
        tc.textContent = "00:" + p2(Math.floor(f / 1800)) + ":" + p2(Math.floor(f / 30) % 60) + ":" + p2(f % 30);
      };
      pinta();
      tl.to(reloj, { t: DUR, duration: DUR, ease: "none", onUpdate: pinta }, 0);
      tl.fromTo("#hud-progreso", { scaleX: 0 }, { scaleX: 1, duration: DUR, ease: "none" }, 0);

      // la etiqueta de sección cambia con cada escena
      const sec = document.getElementById("hud-seccion");
      [
        [2.75, "02 — PROMESA"],
        [6.3, "03 — PRODUCTO"],
        [13.5, "04 — PRUEBAS"],
        [15.6, "05 — MARCA"],
      ].forEach(([t, txt]) => tl.set(sec, { textContent: txt }, t));

      // sobre la viñeta negra final, el HUD pasa a papel
      tl.to("#hud-marco", { color: "#F3ECE4", duration: 0.3, ease: "power2.in" }, 20.2);
      // entrada del marco
      tl.fromTo("#hud-marco", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.05);

      window.__timelines["hud"] = tl;
    })();
  </script>
